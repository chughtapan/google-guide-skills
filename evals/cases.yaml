      rubric:
      - - operation
      - - partial
      - - atomic|error
    negative:
    - id: api-async-and-batch-neg-01
      split: validation
      prompt: Choose batch sizes for a local data-processing loop with no public API.
  - skill: google-api-errors-and-retries
    positive:
    - id: api-errors-and-retries-pos-01
      split: validation
      prompt: Review an API that retries every error, has no request IDs, and uses changing error strings
        as machine-readable codes.
      rubric:
      - - retry|retries
      - - idempoten|request.*id
      - - code|ErrorInfo|structured
    negative:
    - id: api-errors-and-retries-neg-01
      split: validation
      prompt: Rewrite the wording of a GUI validation message without changing its error contract or
