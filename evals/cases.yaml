schema_version: 1

# Explicit skill-name controls are generated one-for-one from the smoke inventory so additions
# cannot silently omit the 100% control gate.
explicit_controls:
  prompt_template: |-
    {invocation}
    State which repository skill you used.

# One positive case per redistributable skill. Run this stage before repeated representative
# suites.
smoke:
  - id: smoke-cpp-style
    prompt: Review a Google C++ class that uses getter names GetSize() and GetName(). Which naming convention applies?
    expected: [google-cpp-style]
  - id: smoke-csharp-style
    prompt: Apply Google's C# conventions to a class with public fields, underscore-prefixed locals, and misplaced using directives.
    expected: [google-csharp-style]
    rubric:
      - ['PascalCase']
      - ['camelCase']
      - ['using.*(top|before).*namespace', '(top|before).*namespace.*using']
    forbidden_claims:
      - 'fields are [`*]*private'
      - 'private static fields.{0,40}s_'
      - 'public fields are only acceptable'
  - id: smoke-documentation-guide
    prompt: Plan a maintainable README for a developer tool using Google's documentation philosophy and practices.
    expected: [google-documentation-guide]
  - id: smoke-go-style
    prompt: Under Google's Go guidance, what conventions apply to API names, returned errors, package comments, and readable tests?
    expected: [google-go-style]
    rubric:
      - ['naming', 'API names?']
      - ['error']
      - ['package comments?']
      - ['test']
  - id: smoke-html-css-style
    prompt: Under Google's HTML and CSS guide, what conventions cover validity, accessibility, selector naming, and formatting?
    expected: [google-html-css-style]
  - id: smoke-java-style
    prompt: Under Google's Java guide, what rules apply to member ordering, naming, braces, and Javadoc?
    expected: [google-java-style]
  - id: smoke-javascript-style
    prompt: Under Google's JavaScript guide, what rules apply to modules, naming, JSDoc, and language features?
    expected: [google-javascript-style]
  - id: smoke-common-lisp-style
    prompt: Under Google's Common Lisp guide, what rules apply to naming, macros, documentation, and error handling?
    expected: [google-common-lisp-style]
  - id: smoke-objective-c-style
    prompt: Under Google's Objective-C guide, what rules apply to Cocoa naming, memory management, formatting, and documentation?
    expected: [google-objective-c-style]
  - id: smoke-python-style
    prompt: Under Google's Python guide, what rules apply to naming, mutable defaults, typing, and docstrings?
    expected: [google-python-style]
    rubric:
      - ['snake.case', 'lower.with.under', 'lowercase.*underscore']
      - ['mutable default', 'shared.*calls']
  - id: smoke-shell-style
    prompt: Under Google's shell guide, what rules apply to Bash quoting, command substitution, naming, scope, and error handling?
    expected: [google-shell-style]
  - id: smoke-typescript-style
    prompt: Under Google's TypeScript guide, what rules apply to modules, types, naming, documentation, and conformance?
    expected: [google-typescript-style]
  - id: smoke-vimscript-style
    prompt: Under Google's Vimscript guide, what rules apply to functions, commands, mappings, naming, and formatting?
    expected: [google-vimscript-style]
  - id: smoke-xml-style
    prompt: Design an extensible XML document format using Google's namespace, naming, validation, and schema conventions.
    expected: [google-xml-style]
  - id: smoke-review-author
    prompt: Prepare my change for review using Google's guidance on small changes, descriptions, and responding to comments.
    expected: [google-code-review-author]
  - id: smoke-review-reviewer
    prompt: Review a teammate's change using Google's review standard, inspection order, comment style, and speed guidance.
    expected: [google-code-review-reviewer]
# Local-only routing controls. These contain prompts and identifiers, not converted book text.
local_smoke:
  - id: local-smoke-teamwork-leadership
    prompt: Help a team improve psychological safety, feedback, blameless postmortems, knowledge sharing, and leadership decisions.
    expected: [google-swe-teamwork-and-leadership]
  - id: local-smoke-developer-productivity
    prompt: Define useful developer-productivity goals and metrics, then explain what a code-search tool should help engineers discover.
    expected: [google-swe-developer-productivity]
  - id: local-smoke-engineering-standards
    prompt: Design organization-wide readability rules, automated formatters, linters, and static-analysis feedback loops.
    expected: [google-swe-engineering-standards]
  - id: local-smoke-code-review-systems
    prompt: Design a code-review policy and tool workflow that balances correctness, comprehension, trust, automation, and review latency.
    expected: [google-swe-code-review-systems]
  - id: local-smoke-testing
    prompt: Design a test strategy covering test size and scope, maintainable unit tests, test doubles, configuration gaps, and larger tests.
    expected: [google-swe-testing]
  - id: local-smoke-change-management
    prompt: Plan a compulsory deprecation and large migration with owners, milestones, automated changes, feature flags, staged rollout, and rollback.
    expected: [google-swe-change-management]
  - id: local-smoke-builds-dependencies-ci
    prompt: Design a hermetic build, dependency, branching, presubmit, post-submit, and CI failure-management policy.
    expected: [google-swe-builds-dependencies-and-ci]
  - id: local-smoke-compute-platforms
    prompt: Choose a compute platform by evaluating failure handling, state, service discovery, containers, serverless tradeoffs, and cloud lock-in.
    expected: [google-swe-compute-platforms]
# Three contrasting skill jobs: language style, role-specific review, and documentation. Each has
# 10 realistic positives and 10 near-miss negatives, split 60/40 for description tuning versus
# held-out validation.
representative:
  - skill: google-python-style
    positive:
      - id: python-pos-01
        split: train
        prompt: Our Python repository follows Google style. Review a function with CamelCase naming and a list default argument.
        rubric:
          - ['snake.case', 'lower.with.under', 'lowercase.*underscore']
          - ['mutable default', 'shared.*calls']
      - id: python-pos-02
        split: train
        prompt: Rewrite these Python imports to match Google's package and module import conventions.
      - id: python-pos-03
        split: train
        prompt: Check this public Python API for Google's type annotation and docstring expectations.
      - id: python-pos-04
        split: train
        prompt: Explain whether this broad except Exception block is acceptable under Google's Python rules.
      - id: python-pos-05
        split: train
        prompt: Review a Python file for Google's line length, indentation, blank lines, and whitespace rules.
      - id: python-pos-06
        split: train
        prompt: Does Google Python style permit a property, staticmethod, and nested helper in this class?
      - id: python-pos-07
        split: validation
        prompt: Apply Google's Python guidance to TODO comments, logging calls, and error-message formatting.
      - id: python-pos-08
        split: validation
        prompt: Review this comprehension and lambda-heavy Python function using Google's language rules.
      - id: python-pos-09
        split: validation
        prompt: Under Google Python conventions, how should this executable module structure its main function?
      - id: python-pos-10
        split: validation
        prompt: Check a Python test module for Google's naming, comments, typing, and formatting conventions.
    negative:
      - id: python-neg-01
        split: train
        prompt: Teach a complete beginner what Python variables and loops are.
      - id: python-neg-02
        split: train
        prompt: Diagnose why pandas merge produces duplicate rows in my dataframe.
      - id: python-neg-03
        split: train
        prompt: Choose between Django and FastAPI for a new web service.
      - id: python-neg-04
        split: train
        prompt: Optimize this NumPy matrix multiplication benchmark.
      - id: python-neg-05
        split: train
        prompt: Explain the CPython garbage collector implementation.
      - id: python-neg-06
        split: train
        prompt: Write a packaging migration from setup.py to pyproject.toml.
      - id: python-neg-07
        split: validation
        prompt: Debug an asyncio deadlock caused by two tasks waiting on one another.
      - id: python-neg-08
        split: validation
        prompt: Design the database schema for a Python billing service.
      - id: python-neg-09
        split: validation
        prompt: Explain Python's descriptor protocol with a teaching example.
      - id: python-neg-10
        split: validation
        prompt: Compare mypy, pyright, and pytype for a large monorepo.

  - skill: google-code-review-reviewer
    positive:
      - id: reviewer-pos-01
        split: train
        prompt: I am reviewing a teammate's 900-line change. Apply Google's review standard and tell me where to start.
        rubric:
          - ['design', 'overall']
          - ['small', 'split']
      - id: reviewer-pos-02
        split: train
        prompt: Help me write a respectful but firm Google-style review comment about a correctness bug.
      - id: reviewer-pos-03
        split: train
        prompt: According to Google's review guidance, should I approve code that improves the system but is not perfect?
      - id: reviewer-pos-04
        split: train
        prompt: What inspection order does Google recommend when navigating a code change?
      - id: reviewer-pos-05
        split: train
        prompt: A review is stalled over a style preference. Apply Google's guidance for reviewer pushback.
      - id: reviewer-pos-06
        split: train
        prompt: How quickly should I respond to a code review under Google's engineering practices?
      - id: reviewer-pos-07
        split: validation
        prompt: Review this change for tests, naming, comments, complexity, and documentation using Google's checklist.
      - id: reviewer-pos-08
        split: validation
        prompt: Decide whether this emergency change can receive a lighter review under Google's rules.
      - id: reviewer-pos-09
        split: validation
        prompt: As the reviewer, distinguish blocking comments from optional polish using Google's conventions.
      - id: reviewer-pos-10
        split: validation
        prompt: The author disagrees with my architectural concern. Use Google's reviewer guidance to resolve it.
    negative:
      - id: reviewer-neg-01
        split: train
        prompt: Write the description for my own change before I send it to review.
      - id: reviewer-neg-02
        split: train
        prompt: Help me split my own large patch into several small changes.
      - id: reviewer-neg-03
        split: train
        prompt: Draft my response to comments left by my reviewer.
      - id: reviewer-neg-04
        split: train
        prompt: Choose a static-analysis vendor for our company.
      - id: reviewer-neg-05
        split: train
        prompt: Explain how GitHub branch protection rules work.
      - id: reviewer-neg-06
        split: train
        prompt: Review this prose for spelling and grammar only.
      - id: reviewer-neg-07
        split: validation
        prompt: Prepare my commit history and changelist summary for reviewers.
      - id: reviewer-neg-08
        split: validation
        prompt: Design a performance benchmark for our JSON parser.
      - id: reviewer-neg-09
        split: validation
        prompt: Teach a new engineer how to use git rebase interactively.
      - id: reviewer-neg-10
        split: validation
        prompt: Select the approvers for an organizational policy document.

  - skill: google-documentation-guide
    positive:
      - id: docs-pos-01
        split: train
        prompt: Use Google's documentation philosophy to plan a README for an open-source command-line tool.
        rubric:
          - ['audience', 'reader']
          - ['maintain', 'maintenance']
      - id: docs-pos-02
        split: train
        prompt: Review this developer guide for Google's documentation best practices and information hierarchy.
      - id: docs-pos-03
        split: train
        prompt: Decide what belongs in our README versus deeper reference documentation using Google's doc guide.
      - id: docs-pos-04
        split: train
        prompt: Apply Google's Markdown documentation conventions to headings, links, code blocks, and lists.
      - id: docs-pos-05
        split: train
        prompt: Create a maintenance plan for technical docs following Google's documentation practices.
      - id: docs-pos-06
        split: train
        prompt: Review an API tutorial for audience, purpose, examples, and long-term accuracy using Google's guide.
      - id: docs-pos-07
        split: validation
        prompt: Our repository has no onboarding docs. Use Google's documentation guide to propose the smallest useful set.
      - id: docs-pos-08
        split: validation
        prompt: Improve a developer README's navigation and scannability using Google's practices.
      - id: docs-pos-09
        split: validation
        prompt: Explain Google's philosophy on treating documentation quality as part of engineering quality.
      - id: docs-pos-10
        split: validation
        prompt: Audit stale technical documentation and recommend ownership and review practices from Google's guide.
    negative:
      - id: docs-neg-01
        split: train
        prompt: Write a television advertisement for a new soft drink.
      - id: docs-neg-02
        split: train
        prompt: Proofread my wedding invitation for warmth and grammar.
      - id: docs-neg-03
        split: train
        prompt: Design a database migration for a payment system.
      - id: docs-neg-04
        split: train
        prompt: Pick a static-site generator for a photography portfolio.
      - id: docs-neg-05
        split: train
        prompt: Summarize this novel for a book club.
      - id: docs-neg-06
        split: train
        prompt: Create a brand voice for a fashion company.
      - id: docs-neg-07
        split: validation
        prompt: Negotiate the legal terms in a software license.
      - id: docs-neg-08
        split: validation
        prompt: Debug a CSS grid layout on mobile browsers.
      - id: docs-neg-09
        split: validation
        prompt: Write release code for a Python package.
      - id: docs-neg-10
        split: validation
        prompt: Plan user interviews for a consumer mobile app.
