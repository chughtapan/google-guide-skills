schema_version: 1

# Explicit skill-name controls are generated one-for-one from the smoke inventory so additions
# cannot silently omit the 100% control gate.
explicit_controls:
  prompt_template: |-
    {invocation}
    State which repository skill you used.

# One positive case per redistributable skill. Run this stage before repeated representative
# suites.
smoke:
  - id: smoke-cpp-style
    prompt: Review a Google C++ class that uses getter names GetSize() and GetName(). Which naming convention applies?
    expected: [google-cpp-style]
  - id: smoke-csharp-style
    prompt: Apply Google's C# conventions to a class with public fields, underscore-prefixed locals, and misplaced using directives.
    expected: [google-csharp-style]
    rubric:
      - ['PascalCase']
      - ['camelCase']
      - ['using.*(top|before).*namespace', '(top|before).*namespace.*using']
    forbidden_claims:
      - 'fields are [`*]*private'
      - 'private static fields.{0,40}s_'
      - 'public fields are only acceptable'
  - id: smoke-documentation-guide
    prompt: Plan a maintainable README for a developer tool using Google's documentation philosophy and practices.
    expected: [google-documentation-guide]
  - id: smoke-go-style
    prompt: Under Google's Go guidance, what conventions apply to API names, returned errors, package comments, and readable tests?
    expected: [google-go-style]
    rubric:
      - ['naming', 'API names?']
      - ['error']
      - ['package comments?']
      - ['test']
  - id: smoke-html-css-style
    prompt: Under Google's HTML and CSS guide, what conventions cover validity, accessibility, selector naming, and formatting?
    expected: [google-html-css-style]
  - id: smoke-java-style
    prompt: Under Google's Java guide, what rules apply to member ordering, naming, braces, and Javadoc?
    expected: [google-java-style]
  - id: smoke-javascript-style
    prompt: Under Google's JavaScript guide, what rules apply to modules, naming, JSDoc, and language features?
    expected: [google-javascript-style]
  - id: smoke-common-lisp-style
    prompt: Under Google's Common Lisp guide, what rules apply to naming, macros, documentation, and error handling?
    expected: [google-common-lisp-style]
  - id: smoke-objective-c-style
    prompt: Under Google's Objective-C guide, what rules apply to Cocoa naming, memory management, formatting, and documentation?
    expected: [google-objective-c-style]
  - id: smoke-python-style
    prompt: Under Google's Python guide, what rules apply to naming, mutable defaults, typing, and docstrings?
    expected: [google-python-style]
    rubric:
      - ['snake.case', 'lower.with.under', 'lowercase.*underscore']
      - ['mutable default', 'shared.*calls']
  - id: smoke-shell-style
    prompt: Under Google's shell guide, what rules apply to Bash quoting, command substitution, naming, scope, and error handling?
    expected: [google-shell-style]
  - id: smoke-typescript-style
    prompt: Under Google's TypeScript guide, what rules apply to modules, types, naming, documentation, and conformance?
    expected: [google-typescript-style]
  - id: smoke-vimscript-style
    prompt: Under Google's Vimscript guide, what rules apply to functions, commands, mappings, naming, and formatting?
    expected: [google-vimscript-style]
  - id: smoke-xml-style
    prompt: Design an extensible XML document format using Google's namespace, naming, validation, and schema conventions.
    expected: [google-xml-style]
  - id: smoke-review-author
    prompt: Prepare my change for review using Google's guidance on small changes, descriptions, and responding to comments.
    expected: [google-code-review-author]
  - id: smoke-review-reviewer
    prompt: Review a teammate's change using Google's review standard, inspection order, comment style, and speed guidance.
    expected: [google-code-review-reviewer]
  - id: smoke-api-resource-design
    prompt: Design a resource-oriented API for publishers and books. Review a proposed flat table-shaped
      endpoint and explain resource names and parent-child associations.
    expected:
    - google-api-resource-design
    rubric:
    - - resource
    - - hierarch|parent|collection
    - - database.*(schema|coupl)|schema.*(database|storage)
  - id: smoke-api-methods
    prompt: Review an AIP-style update endpoint that uses PUT, triggers an email side effect, and ignores
      stale etags. Recommend method semantics.
    expected:
    - google-api-methods
    rubric:
    - - PATCH
    - - side.effect|custom method
    - - etag|freshness
  - id: smoke-api-data-modeling
    prompt: Review an API schema with a boolean state flag, ambiguous numeric units, timestamps encoded
      as arbitrary strings, and required fields added later.
    expected:
    - google-api-data-modeling
    rubric:
    - - unit|quantity
    - - timestamp|duration
    - - state|enum
  - id: smoke-api-list-design
    prompt: Design list pagination with opaque page tokens, filtering, ordering, and partial results.
      The proposal adds pagination to an existing unpaginated API.
    expected:
    - google-api-list-design
    rubric:
    - - opaque
    - - compatib|breaking
    - - filter|order
  - id: smoke-api-async-and-batch
    prompt: Design a long-running batch-create API. Explain operation completion, error reporting, and
      when partial success is appropriate.
    expected:
    - google-api-async-and-batch
    rubric:
    - - operation
    - - partial
    - - atomic|error
  - id: smoke-api-errors-and-retries
    prompt: Review an API that retries every error, has no request IDs, and uses changing error strings
      as machine-readable codes.
    expected:
    - google-api-errors-and-retries
    rubric:
    - - retry|retries
    - - idempoten|request.*id
    - - code|ErrorInfo|structured
  - id: smoke-api-evolution
    prompt: Assess compatibility of an API release that renames a field, changes its default, and removes
      an enum value. Propose a versioning approach.
    expected:
    - google-api-evolution
    rubric:
    - - compatib|breaking
    - - default
    - - version|deprecat
  - id: smoke-api-documentation
    prompt: Write API field and method comments that explain units, defaults, valid ranges, side effects,
      and failure behavior under AIP conventions.
    expected:
    - google-api-documentation
    rubric:
    - - unit
    - - default
    - - side.effect|failure|error
  - id: smoke-design-docs
    prompt: Draft a system design document for a new job service, covering requirements, alternatives,
      scaling, dependencies, recovery, and security tradeoffs.
    expected:
    - google-design-docs
    rubric:
    - - requirement
    - - dependenc|scal
    - - security|recover
  - id: smoke-adr
    prompt: Write an architecture decision record for choosing between a durable queue and a database
      polling table. Preserve why the choice was made and how later changes should be recorded.
    expected:
    - google-adr
    rubric:
    - - context|problem
    - - option|alternative
    - - reason|rationale
    - - history|previous|timestamp
  - id: smoke-service-architecture
    prompt: Our services require coordinated releases and shared integration environments. Review service
      boundaries to enable independent deployment and testing.
    expected:
    - google-service-architecture
    rubric:
    - - coupl
    - - independen
    - - test|deploy
  - id: smoke-threat-modeling
    prompt: Threat-model a document service used by employees and contractors. Identify adversaries,
      insider capabilities, trust boundaries, and risk priorities.
    expected:
    - google-threat-modeling
    rubric:
    - - insider
    - - adversar|attacker
    - - risk|boundary|boundaries
  - id: smoke-secure-design
    prompt: Review a system with broad administrator credentials, a general-purpose remote shell, no
      audit trail, and no emergency-access controls.
    expected:
    - google-secure-design
    rubric:
    - - least privilege
    - - audit
    - - breakglass|emergency
  - id: smoke-security-testing
    prompt: Plan security tests for a parser and an authorization boundary. Compare fuzzing, dynamic
      analysis, static analysis, and negative permission tests.
    expected:
    - google-security-testing
    rubric:
    - - fuzz
    - - static|dynamic
    - - privilege|permission|authoriz
  - id: smoke-secure-delivery
    prompt: Review a release pipeline that allows manual binary uploads and unsigned builds. Propose
      artifact provenance, deployment policy, and audited emergency access.
    expected:
    - google-secure-delivery
    rubric:
    - - provenance
    - - sign|artifact
    - - breakglass|emergency|audit
  - id: smoke-reliability-design
    prompt: Review a service for failure domains, redundancy, graceful degradation, overload handling,
      and tested recovery.
    expected:
    - google-reliability-design
    rubric:
    - - failure domain|blast radius
    - - degrad|shed|throttl
    - - recover|rollback|failover
  - id: smoke-incident-response
    prompt: Prepare a response plan for a production outage with a suspected compromise. Assign roles,
      coordinate handovers, plan recovery, and capture lessons afterward.
    expected:
    - google-incident-response
    rubric:
    - - triage|triaging|incident commander
    - - handover|communication
    - - postmortem|post.mortem|lesson
  - id: smoke-observability
    prompt: Review a monitoring plan that has many CPU dashboards but no user-visible signals or actionable
      failure notifications. Recommend instrumentation and alerting improvements.
    expected:
    - google-observability
    rubric:
    - - user|customer
    - - black.box|white.box|instrument
    - - alert|notif
  - id: smoke-slos
    prompt: Define an availability SLI, a 99.9 percent SLO, its error budget, and the tradeoffs between
      rolling and calendar compliance periods.
    expected:
    - google-slos
    rubric:
    - - indicator|ratio
    - - budget
    - - rolling
    - - calendar
  - id: smoke-delivery-performance
    prompt: Design a software delivery improvement review using the current five DORA metrics. Explain
      why aggregating unlike services and ranking individuals is misleading.
    expected:
    - google-delivery-performance
    rubric:
    - - lead time
    - - deployment frequency
    - - recovery
    - - fail
    - - rework
  - id: smoke-database-change-management
    prompt: Plan a zero-downtime database schema change with versioned migrations and application versions
      that overlap during deployment.
    expected:
    - google-database-change-management
    rubric:
    - - migration
    - - version
    - - compatib|decoupl|expand|contract
  - id: smoke-developer-documentation-style
    prompt: Edit developer documentation for Google-style voice, code formatting, UI labels, descriptive
      links, and clear procedural steps.
    expected:
    - google-developer-documentation-style
    rubric:
    - - code
    - - bold|UI
    - - link
    - - step|procedure
  - id: smoke-technical-writing
    prompt: 'Improve a technical explanation for new operators: define the audience, set scope, organize
      key points, self-edit, and include effective sample code.'
    expected:
    - google-technical-writing
    rubric:
    - - audience
    - - scope
    - - sample|example
    - - edit|read.*aloud|read.*loud
  - id: smoke-accessible-documentation
    prompt: Review documentation that relies on red and green arrows, has generic link labels, and omits
      alt text for complex diagrams.
    expected:
    - google-accessible-documentation
    rubric:
    - - alt text
    - - color|colour
    - - link
    - - complex|diagram
  - id: smoke-error-messages
    prompt: Rewrite "Invalid value" for an attachment upload that exceeds a known size limit. Explain
      the cause, constraint, and a concrete recovery action in helpful language.
    expected:
    - google-error-messages
    rubric:
    - - limit|maximum|size
    - - reduc|remov|smaller|compress
    - - specific|cause|exceed

# Local-only routing controls. These contain prompts and identifiers, not converted book text.
local_smoke:
  - id: local-smoke-teamwork-leadership
    prompt: Help a team improve psychological safety, feedback, blameless postmortems, knowledge sharing, and leadership decisions.
    expected: [google-swe-teamwork-and-leadership]
  - id: local-smoke-developer-productivity
    prompt: Define useful developer-productivity goals and metrics, then explain what a code-search tool should help engineers discover.
    expected: [google-swe-developer-productivity]
  - id: local-smoke-engineering-standards
    prompt: Design organization-wide readability rules, automated formatters, linters, and static-analysis feedback loops.
    expected: [google-swe-engineering-standards]
  - id: local-smoke-code-review-systems
    prompt: Design a code-review policy and tool workflow that balances correctness, comprehension, trust, automation, and review latency.
    expected: [google-swe-code-review-systems]
  - id: local-smoke-testing
    prompt: Design a test strategy covering test size and scope, maintainable unit tests, test doubles, configuration gaps, and larger tests.
    expected: [google-swe-testing]
  - id: local-smoke-change-management
    prompt: Plan a compulsory deprecation and large migration with owners, milestones, automated changes, feature flags, staged rollout, and rollback.
    expected: [google-swe-change-management]
  - id: local-smoke-builds-dependencies-ci
    prompt: Design a hermetic build, dependency, branching, presubmit, post-submit, and CI failure-management policy.
    expected: [google-swe-builds-dependencies-and-ci]
  - id: local-smoke-compute-platforms
    prompt: Choose a compute platform by evaluating failure handling, state, service discovery, containers, serverless tradeoffs, and cloud lock-in.
    expected: [google-swe-compute-platforms]
# Three contrasting skill jobs: language style, role-specific review, and documentation. Each has
# 10 realistic positives and 10 near-miss negatives, split 60/40 for description tuning versus
# held-out validation.
representative:
  - skill: google-python-style
    positive:
      - id: python-pos-01
        split: train
        prompt: Our Python repository follows Google style. Review a function with CamelCase naming and a list default argument.
        rubric:
          - ['snake.case', 'lower.with.under', 'lowercase.*underscore']
          - ['mutable default', 'shared.*calls']
      - id: python-pos-02
        split: train
        prompt: Rewrite these Python imports to match Google's package and module import conventions.
      - id: python-pos-03
        split: train
        prompt: Check this public Python API for Google's type annotation and docstring expectations.
      - id: python-pos-04
        split: train
        prompt: Explain whether this broad except Exception block is acceptable under Google's Python rules.
      - id: python-pos-05
        split: train
        prompt: Review a Python file for Google's line length, indentation, blank lines, and whitespace rules.
      - id: python-pos-06
        split: train
        prompt: Does Google Python style permit a property, staticmethod, and nested helper in this class?
      - id: python-pos-07
        split: validation
        prompt: Apply Google's Python guidance to TODO comments, logging calls, and error-message formatting.
      - id: python-pos-08
        split: validation
        prompt: Review this comprehension and lambda-heavy Python function using Google's language rules.
      - id: python-pos-09
        split: validation
        prompt: Under Google Python conventions, how should this executable module structure its main function?
      - id: python-pos-10
        split: validation
        prompt: Check a Python test module for Google's naming, comments, typing, and formatting conventions.
    negative:
      - id: python-neg-01
        split: train
        prompt: Teach a complete beginner what Python variables and loops are.
      - id: python-neg-02
        split: train
        prompt: Diagnose why pandas merge produces duplicate rows in my dataframe.
      - id: python-neg-03
        split: train
        prompt: Choose between Django and FastAPI for a new web service.
      - id: python-neg-04
        split: train
        prompt: Optimize this NumPy matrix multiplication benchmark.
      - id: python-neg-05
        split: train
        prompt: Explain the CPython garbage collector implementation.
      - id: python-neg-06
        split: train
        prompt: Write a packaging migration from setup.py to pyproject.toml.
      - id: python-neg-07
        split: validation
        prompt: Debug an asyncio deadlock caused by two tasks waiting on one another.
      - id: python-neg-08
        split: validation
        prompt: Design the database schema for a Python billing service.
      - id: python-neg-09
        split: validation
        prompt: Explain Python's descriptor protocol with a teaching example.
      - id: python-neg-10
        split: validation
        prompt: Compare mypy, pyright, and pytype for a large monorepo.

  - skill: google-code-review-reviewer
    positive:
      - id: reviewer-pos-01
        split: train
        prompt: I am reviewing a teammate's 900-line change. Apply Google's review standard and tell me where to start.
        rubric:
          - ['design', 'overall']
          - ['small', 'split']
      - id: reviewer-pos-02
        split: train
        prompt: Help me write a respectful but firm Google-style review comment about a correctness bug.
      - id: reviewer-pos-03
        split: train
        prompt: According to Google's review guidance, should I approve code that improves the system but is not perfect?
      - id: reviewer-pos-04
        split: train
        prompt: What inspection order does Google recommend when navigating a code change?
      - id: reviewer-pos-05
        split: train
        prompt: A review is stalled over a style preference. Apply Google's guidance for reviewer pushback.
      - id: reviewer-pos-06
        split: train
        prompt: How quickly should I respond to a code review under Google's engineering practices?
      - id: reviewer-pos-07
        split: validation
        prompt: Review this change for tests, naming, comments, complexity, and documentation using Google's checklist.
      - id: reviewer-pos-08
        split: validation
        prompt: Decide whether this emergency change can receive a lighter review under Google's rules.
      - id: reviewer-pos-09
        split: validation
        prompt: As the reviewer, distinguish blocking comments from optional polish using Google's conventions.
      - id: reviewer-pos-10
        split: validation
        prompt: The author disagrees with my architectural concern. Use Google's reviewer guidance to resolve it.
    negative:
      - id: reviewer-neg-01
        split: train
        prompt: Write the description for my own change before I send it to review.
      - id: reviewer-neg-02
        split: train
        prompt: Help me split my own large patch into several small changes.
      - id: reviewer-neg-03
        split: train
        prompt: Draft my response to comments left by my reviewer.
      - id: reviewer-neg-04
        split: train
        prompt: Choose a static-analysis vendor for our company.
      - id: reviewer-neg-05
        split: train
        prompt: Explain how GitHub branch protection rules work.
      - id: reviewer-neg-06
        split: train
        prompt: Review this prose for spelling and grammar only.
      - id: reviewer-neg-07
        split: validation
        prompt: Prepare my commit history and changelist summary for reviewers.
      - id: reviewer-neg-08
        split: validation
        prompt: Design a performance benchmark for our JSON parser.
      - id: reviewer-neg-09
        split: validation
        prompt: Teach a new engineer how to use git rebase interactively.
      - id: reviewer-neg-10
        split: validation
        prompt: Select the approvers for an organizational policy document.

  - skill: google-documentation-guide
    positive:
      - id: docs-pos-01
        split: train
        prompt: Use Google's documentation philosophy to plan a README for an open-source command-line tool.
        rubric:
          - ['audience', 'reader']
          - ['maintain', 'maintenance']
      - id: docs-pos-02
        split: train
        prompt: Review this developer guide for Google's documentation best practices and information hierarchy.
      - id: docs-pos-03
        split: train
        prompt: Decide what belongs in our README versus deeper reference documentation using Google's doc guide.
      - id: docs-pos-04
        split: train
        prompt: Apply Google's Markdown documentation conventions to headings, links, code blocks, and lists.
      - id: docs-pos-05
        split: train
        prompt: Create a maintenance plan for technical docs following Google's documentation practices.
      - id: docs-pos-06
        split: train
        prompt: Review an API tutorial for audience, purpose, examples, and long-term accuracy using Google's guide.
      - id: docs-pos-07
        split: validation
        prompt: Our repository has no onboarding docs. Use Google's documentation guide to propose the smallest useful set.
      - id: docs-pos-08
        split: validation
        prompt: Improve a developer README's navigation and scannability using Google's practices.
      - id: docs-pos-09
        split: validation
        prompt: Explain Google's philosophy on treating documentation quality as part of engineering quality.
      - id: docs-pos-10
        split: validation
        prompt: Audit stale technical documentation and recommend ownership and review practices from Google's guide.
    negative:
      - id: docs-neg-01
        split: train
        prompt: Write a television advertisement for a new soft drink.
      - id: docs-neg-02
        split: train
        prompt: Proofread my wedding invitation for warmth and grammar.
      - id: docs-neg-03
        split: train
        prompt: Design a database migration for a payment system.
      - id: docs-neg-04
        split: train
        prompt: Pick a static-site generator for a photography portfolio.
      - id: docs-neg-05
        split: train
        prompt: Summarize this novel for a book club.
      - id: docs-neg-06
        split: train
        prompt: Create a brand voice for a fashion company.
      - id: docs-neg-07
        split: validation
        prompt: Negotiate the legal terms in a software license.
      - id: docs-neg-08
        split: validation
        prompt: Debug a CSS grid layout on mobile browsers.
      - id: docs-neg-09
        split: validation
        prompt: Write release code for a Python package.
      - id: docs-neg-10
        split: validation
        prompt: Plan user interviews for a consumer mobile app.

  - skill: google-api-resource-design
    positive:
    - id: api-resource-design-pos-01
      split: validation
      prompt: Design a resource-oriented API for publishers and books. Review a proposed flat table-shaped
        endpoint and explain resource names and parent-child associations.
      rubric:
      - - resource
      - - hierarch|parent|collection
      - - database.*(schema|coupl)|schema.*(database|storage)
    negative:
    - id: api-resource-design-neg-01
      split: validation
      prompt: Normalize a relational database schema for publishers and books; no network API is being
        designed.
  - skill: google-api-methods
    positive:
    - id: api-methods-pos-01
      split: validation
      prompt: Review an AIP-style update endpoint that uses PUT, triggers an email side effect, and
        ignores stale etags. Recommend method semantics.
      rubric:
      - - PATCH
      - - side.effect|custom method
      - - etag|freshness
    negative:
    - id: api-methods-neg-01
      split: validation
      prompt: Design pagination and filtering for an existing read-only collection endpoint.
  - skill: google-api-data-modeling
    positive:
    - id: api-data-modeling-pos-01
      split: validation
      prompt: Review an API schema with a boolean state flag, ambiguous numeric units, timestamps encoded
        as arbitrary strings, and required fields added later.
      rubric:
      - - unit|quantity
      - - timestamp|duration
      - - state|enum
    negative:
    - id: api-data-modeling-neg-01
      split: validation
      prompt: Optimize the storage layout and indexes of a database table.
  - skill: google-api-list-design
    positive:
    - id: api-list-design-pos-01
      split: validation
      prompt: Design list pagination with opaque page tokens, filtering, ordering, and partial results.
        The proposal adds pagination to an existing unpaginated API.
      rubric:
      - - opaque
      - - compatib|breaking
      - - filter|order
    negative:
    - id: api-list-design-neg-01
      split: validation
      prompt: Add CSS pagination controls to a blog; the backend contract is already fixed.
  - skill: google-api-async-and-batch
    positive:
    - id: api-async-and-batch-pos-01
      split: validation
      prompt: Design a long-running batch-create API. Explain operation completion, error reporting,
