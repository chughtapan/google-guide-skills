      rubric:
      - - unit
      - - default
      - - side.effect|failure|error
    negative:
    - id: api-documentation-neg-01
      split: validation
      prompt: Organize a developer portal into tutorials and how-to guides; no API reference comments
        need editing.
  - skill: google-design-docs
    positive:
    - id: design-docs-pos-01
      split: validation
      prompt: Draft a system design document for a new job service, covering requirements, alternatives,
        scaling, dependencies, recovery, and security tradeoffs.
      rubric:
      - - requirement
      - - dependenc|scal
      - - security|recover
    negative:
    - id: design-docs-neg-01
      split: validation
      prompt: Record only the decision to choose a durable queue over a database polling table in an
        ADR.
  - skill: google-adr
    positive:
    - id: adr-pos-01
      split: validation
      prompt: Write an architecture decision record for choosing between a durable queue and a database
        polling table. Preserve why the choice was made and how later changes should be recorded.
      rubric:
      - - context|problem
      - - option|alternative
      - - reason|rationale
      - - history|previous|timestamp
    negative:
    - id: adr-neg-01
      split: validation
      prompt: Write a full system design document with capacity planning and data flows; no individual
        decision has been made yet.
  - skill: google-service-architecture
    positive:
    - id: service-architecture-pos-01
      split: validation
      prompt: Our services require coordinated releases and shared integration environments. Review
        service boundaries to enable independent deployment and testing.
      rubric:
      - - coupl
      - - independen
      - - test|deploy
    negative:
    - id: service-architecture-neg-01
      split: validation
      prompt: Design resource names and HTTP verbs for a single public API.
  - skill: google-threat-modeling
    positive:
