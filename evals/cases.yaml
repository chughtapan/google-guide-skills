  - skill: google-api-evolution
    positive:
    - id: api-evolution-pos-01
      split: validation
      prompt: Assess compatibility of an API release that renames a field, changes its default, and
        removes an enum value. Propose a versioning approach.
      rubric:
      - - compatib|breaking
      - - default
      - - version|deprecat
    negative:
    - id: api-evolution-neg-01
      split: validation
      prompt: Plan a database index rollout without changing the public API.
  - skill: google-api-documentation
    positive:
    - id: api-documentation-pos-01
      split: validation
      prompt: Write API field and method comments that explain units, defaults, valid ranges, side effects,
