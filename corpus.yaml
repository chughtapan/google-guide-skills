  - id: google-angularjs-style
    title: Google AngularJS Style Guide
    url: https://google.github.io/styleguide/angularjs-google-style.html
    license: CC-BY-3.0
    status: historical-guide-not-packaged
    reason: >-
      Last updated in 2013 and written for AngularJS 1.x, Closure, IE8, and internal Google
      tooling. Keep it discoverable without loading obsolete defaults into modern agents.
    tags: [language, javascript, angularjs, style]

  - id: google-json-style
    title: Google JSON Style Guide
    url: https://google.github.io/styleguide/jsoncstyleguide.xml
    license: CC-BY-3.0-with-Apache-2.0-code
    status: historical-guide-not-packaged
    reason: >-
      Revision 0.9 centers retired Google Data and YouTube API v2 response envelopes. Modern API
      contracts should follow current product requirements rather than this historical protocol.
    tags: [language, json, api, style]

  - id: google-r-style
    title: Google's R Style Guide
    url: https://google.github.io/styleguide/Rguide.html
    license: NOASSERTION
